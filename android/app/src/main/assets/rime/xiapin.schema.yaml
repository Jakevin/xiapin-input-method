# Rime schema (Android build)
# encoding: utf-8
#
# Android 版主方案：與桌面版相同，但移除 lua_filter（Android librime 未編 Lua 插件）。
# 字根提示改由 App 層 (BoshiamyComment.java) 查 xiapin_liur.dict.yaml 提供。

schema:
  schema_id: xiapin
  name: "蝦拼"
  version: "0.1.0-android"
  author:
    - "蝦拼輸入法 project"
  description: |
    Experimental Pinyin plus openxiami root schema (Android).

switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: full_shape
    states: ["半形", "全形"]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - script_translator@pinyin
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '"
  algebra:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

translator:
  dictionary: xiapin.extended
  enable_sentence: false
  enable_completion: true
  enable_user_dict: true
  initial_quality: 1000

pinyin:
  tag: abc
  dictionary: luna_pinyin
  enable_sentence: true
  enable_user_dict: true
  initial_quality: 100

menu:
  page_size: 9

punctuator:
  import_preset: default

key_binder:
  bindings:
    - { when: has_menu, accept: space, send: space }
    - { when: paging, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    - { when: always, accept: Shift+space, select: xiapin_english }

recognizer:
  import_preset: default

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
