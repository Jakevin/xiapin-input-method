# Rime schema (Android) — 蝦拼（字根 only）
# encoding: utf-8
# 與注音 / 英文分開，避免混打干擾。

schema:
  schema_id: xiapin
  name: "蝦拼"
  version: "0.3.0-android"
  author:
    - "蝦拼輸入法 project"
  description: |
    嘸蝦米字根輸入（Android）。不混注音/拼音。

switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: full_shape
    states: ["半形", "全形"]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '"

translator:
  dictionary: xiapin.extended
  enable_sentence: false
  enable_completion: true
  enable_user_dict: true
  initial_quality: 1000

menu:
  page_size: 9

punctuator:
  import_preset: default

key_binder:
  bindings:
    - { when: paging, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: space, send: space }
    - { when: always, accept: Shift+space, select: xiapin_english }

recognizer:
  import_preset: default

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
