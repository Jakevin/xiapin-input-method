# Rime schema (Android) — 注音（大千 only）
# encoding: utf-8
# 與蝦拼字根分開；使用預編 bopomofo prism + terra_pinyin。

schema:
  schema_id: xiapin_zhuyin
  name: "蝦拼注音"
  version: "0.3.0-android"
  author:
    - "蝦拼輸入法 project"
  description: |
    注音大千鍵盤（Android）。不混字根/拼音。

switches:
  - name: full_shape
    states: ["半形", "全形"]

engine:
  processors:
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  # 大千：字母 + 數字聲調 + ,.;/-
  alphabet: "abcdefghijklmnopqrstuvwxyz0123456789,.;/-"
  delimiter: " '"
  # prism 已由 bopomofo_build 預編；此處不再重跑 algebra

translator:
  dictionary: terra_pinyin
  prism: bopomofo
  enable_sentence: true
  enable_user_dict: true
  enable_completion: true
  initial_quality: 1000
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"

menu:
  page_size: 9

punctuator:
  import_preset: default

key_binder:
  bindings:
    # 組字中：, . - ; / 送給注音，不要翻頁
    - { when: composing, accept: comma, send: comma }
    - { when: composing, accept: period, send: period }
    - { when: composing, accept: minus, send: minus }
    - { when: composing, accept: slash, send: slash }
    - { when: composing, accept: semicolon, send: semicolon }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: space, send: space }
    - { when: always, accept: Shift+space, select: xiapin }

recognizer:
  import_preset: default
