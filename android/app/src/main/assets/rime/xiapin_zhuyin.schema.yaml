# Rime schema (Android) — 注音（大千 only）
# encoding: utf-8
# 與蝦拼字根完全分開；prism 對齊 bopomofo_build。

schema:
  schema_id: xiapin_zhuyin
  name: "蝦拼注音"
  version: "0.3.1-android"
  author:
    - "蝦拼輸入法 project"
  description: |
    注音大千鍵盤（Android）。不混字根/拼音。

switches:
  - name: full_shape
    states: ["半形", "全形"]

engine:
  processors:
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  # 與 bopomofo_build 一致（大千鍵位）
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347abcdefghijklmnopqrstuvwxyz"
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-abcdefghijklmnopqrstuvwxyz"
  finals: " 6347"
  delimiter: "'"
  # 若裝置尚無可用 prism，以 algebra 現算（與 bopomofo_build 相同）
  algebra:
    __patch:
      - zhuyin:/pinyin_to_zhuyin
      - zhuyin:/abbreviation
      - zhuyin:/keymap_bopomofo

translator:
  dictionary: terra_pinyin
  prism: bopomofo
  enable_sentence: false
  enable_user_dict: true
  enable_completion: true
  initial_quality: 1000
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"

menu:
  page_size: 9

punctuator:
  import_preset: default

key_binder:
  bindings:
    - { when: composing, accept: comma, send: comma }
    - { when: composing, accept: period, send: period }
    - { when: composing, accept: minus, send: minus }
    - { when: composing, accept: slash, send: slash }
    - { when: composing, accept: semicolon, send: semicolon }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: space, send: space }

recognizer:
  import_preset: default
